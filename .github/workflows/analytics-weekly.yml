# Недельный отчёт и пересчёт весов рубрик.
# Время в cron — UTC. Дубай = UTC+4.
#   04:00 UTC в понедельник = 08:00 понедельника по Дубаю.
name: Weekly Analytics

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline-state
  cancel-in-progress: false

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история: scripts/commit_state.sh делает git pull --rebase,
          # а на shallow-клоне rebase падает.
          fetch-depth: 0

      # workflow_dispatch и schedule фиксируют SHA в момент события; пока запуск
      # ждал в очереди concurrency, другой мог закоммитить state/. Работаем
      # от актуальной вершины ветки, иначе коммит состояния упрётся в конфликт.
      - name: Актуальная вершина ветки
        run: |
          git fetch -q origin "$GITHUB_REF_NAME"
          git checkout -q -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Недельный отчёт
        env:
          DRY_RUN: "0"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
        run: python -m pipeline.run --stage analytics

      - name: Коммит состояния
        run: 'bash scripts/commit_state.sh "state: недельная аналитика"'
