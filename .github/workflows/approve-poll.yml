# Опрос кнопок апрува через getUpdates (long-poll).
# Webhook невозможен без постоянного хоста, поэтому короткий workflow
# периодически забирает обновления. offset персистится в state/.
#
# Время в cron — UTC. Дубай = UTC+4.
#   */30 4-18 UTC = каждые 30 минут с 08:00 до 22:30 по Дубаю.
name: Approve Poll

on:
  schedule:
    - cron: "*/30 4-18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline-state
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # 6 minutes were enough for the poll alone; the inbox step below may
    # additionally read a PDF or transcribe a video.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история: scripts/commit_state.sh делает git pull --rebase,
          # а на shallow-клоне rebase падает.
          fetch-depth: 0

      # workflow_dispatch и schedule фиксируют SHA в момент события; пока запуск
      # ждал в очереди concurrency, другой мог закоммитить state/. Работаем
      # от актуальной вершины ветки, иначе коммит состояния упрётся в конфликт.
      - name: Актуальная вершина ветки
        run: |
          git fetch -q origin "$GITHUB_REF_NAME"
          git checkout -q -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Long-poll кнопок апрува
        env:
          DRY_RUN: "0"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
        run: python -m pipeline.run --stage approve --rounds 2 --poll-timeout 45

      # «Переписать» (кнопка или ответ «переписать: …» на превью) и
      # screenshots, PDFs and videos the owner forwarded during the poll
      # become drafts right here, so a preview arrives within ~30 minutes
      # instead of waiting for the next Collect & Generate run. Exits at once
      # when there is nothing new, so the minute budget is unaffected.
      - name: Переписать + копилка владельца → черновики
        env:
          DRY_RUN: "0"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Only for video transcription (Whisper); without it videos are
          # drafted from their caption alone.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'anthropic' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'claude-opus-5' }}
        run: python -m pipeline.run --stage inbox

      - name: Коммит состояния
        run: 'bash scripts/commit_state.sh "state: решения по апруву"'
