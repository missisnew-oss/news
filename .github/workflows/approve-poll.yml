# Опрос кнопок апрува через getUpdates (long-poll).
# Webhook невозможен без постоянного хоста, поэтому короткий workflow
# периодически забирает обновления. offset персистится в state/.
#
# Время в cron — UTC. Дубай = UTC+4.
#   */30 4-18 UTC = каждые 30 минут с 08:00 до 22:30 по Дубаю.
name: Approve Poll

on:
  schedule:
    - cron: "*/30 4-18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline-state
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Long-poll кнопок апрува
        env:
          DRY_RUN: "0"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
        run: python -m pipeline.run --stage approve --rounds 2 --poll-timeout 45

      - name: Коммит состояния
        run: bash scripts/commit_state.sh "state: решения по апруву"
