# Публикация одобренных постов по слотам.
# Слоты: 09:30 и 19:30 по Дубаю. Время в cron — UTC (Дубай = UTC+4):
#   05:25 и 05:35 UTC = 09:25 и 09:35 Дубай
#   15:25 и 15:35 UTC = 19:25 и 19:35 Дубай
# Две попытки на слот — страховка от опоздания планировщика GitHub.
# Публикация идемпотентна: второй запуск не создаст дубль.
name: Publish

on:
  schedule:
    - cron: "25,35 5 * * *"
    - cron: "25,35 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline-state
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история: scripts/commit_state.sh делает git pull --rebase,
          # а на shallow-клоне rebase падает.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Публикация
        env:
          DRY_RUN: "0"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
        run: python -m pipeline.run --stage publish

      - name: Коммит состояния
        run: 'bash scripts/commit_state.sh "state: публикация"'
