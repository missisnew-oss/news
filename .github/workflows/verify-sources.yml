# Еженедельная перепроверка реестра источников реальными HTTP-запросами.
# 02:00 UTC по воскресеньям = 06:00 воскресенья по Дубаю.
name: Verify Sources

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: write

# Тот же замок, что и у остальных: workflow пишет state/sources_health.json,
# и одновременный запуск с другим дал бы non-fast-forward.
concurrency:
  group: pipeline-state
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история: scripts/commit_state.sh делает git pull --rebase,
          # а на shallow-клоне rebase падает.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      # Нерабочие источники не должны валить workflow — их надо зафиксировать.
      - name: Проверка источников
        env:
          DRY_RUN: "0"
          # Приватные каналы-источники (опционально, см. docs/SETUP.md «Приватные каналы»)
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python -m pipeline.verify_sources || true

      - name: Коммит результата проверки
        run: 'bash scripts/commit_state.sh "state: проверка источников"'
