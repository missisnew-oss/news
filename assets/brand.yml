# Фирменный стиль картинок канала. Всё, что здесь написано, можно менять
# без правки кода — pipeline/illustrate.py читает файл при каждой отрисовке.
#
# Основной формат — «light»: светлая компактная карточка 1200×630 без фото
# и без тёмных блоков. Кремовый фон, слева сверху пилюли «ДУБАЙ» и тег
# рубрики, справа сверху надпись бренда, тёмно-синий заголовок, золотая
# полоска и одна строка-акцент (цифра или короткий факт). Бесплатно:
# ни стоков, ни ИИ-генерации.
# Запасные форматы (card.style): «photo» (как у Whitewill: фото на весь кадр,
# затемнение, заголовок жирным слева сверху, внизу пилюли) и «editorial»
# (как у Ruble: сериф по центру внизу).

# ---------- Название и логотип ----------
# Надпись-«вордмарк» в углу карточки, пока нет логотипа. Заглавными.
name: "REALNEW MARY"
# Маленькая строка под надписью (можно оставить пустой: tagline: "").
tagline: "REAL ESTATE · DUBAI"
# Логотип. Положите PNG с прозрачным фоном (лучше белый/светлый рисунок,
# высотой от 200 px) по этому пути — карточки начнут ставить его вместо
# надписи. Пока файла нет, рисуется надпись из name.
logo_path: "assets/logo.png"

# ---------- Палитра ----------
# Цвета в формате #RRGGBB.
bg_from: "#0A1F35"    # градиентная карточка (запасной формат без фото): верх — тёмно-синий
bg_to:   "#05080F"    # низ — почти чёрный
accent:  "#F2B84B"    # тёплый золотой: цифра-акцент, точка в пилюле, полоска
text:    "#FFFFFF"    # заголовок
muted:   "#D9E2EA"    # подпись под заголовком, tagline
pill_bg: "#0B1622"    # заливка пилюль
pill_alpha: 150       # прозрачность пилюль: 0 — прозрачные, 255 — сплошные

# ---------- Светлая карточка ----------
light:
  bg:        "#F7F4EE"   # кремовый фон
  text:      "#10233F"   # заголовок, текст в пилюлях — тёмно-синий
  muted:     "#6B7280"   # подпись под брендом, вторая строка
  pill_bg:   "#EAE6DD"   # заливка пилюль, чуть темнее фона
  accent:    "#D9A441"   # золотая полоска и строка-акцент
  wash_blue: "#DCE7F2"   # мягкое голубое пятно справа сверху
  wash_gold: "#F3E4C4"   # мягкое золотистое пятно слева снизу
  # Тёмная версия логотипа для светлого фона (PNG с прозрачностью). Пока
  # файла нет — рисуется надпись из name.
  logo_path: "assets/logo-dark.png"

# ---------- Размеры ----------
card:
  # Стиль: "light" (светлая компактная карточка, см. блок light ниже),
  # "photo" (Whitewill: фото, жирный гротеск слева сверху) или
  # "editorial" (Ruble: фото, сериф по центру внизу).
  style: "light"
  # Формат для photo/editorial: "4:5" (1080×1350, вертикальный) или "16:9"
  # (1200×675). Светлая карточка всегда 1200×630.
  size: "16:9"
  # Отступ от края кадра, px (при ширине 1080; для других размеров масштабируется).
  margin: 64
  # Радиус скругления пилюль, px.
  pill_radius: 30
  # Максимум строк заголовка. Кегль подбирается автоматически.
  max_lines: 4
  # Насколько затемнять фото сверху (под заголовком) и снизу (под пилюлями), 0–255.
  shade_top: 150
  shade_bottom: 200

# ---------- Шрифты ----------
# Пустые значения = используем системный DejaVu Sans Bold (есть на раннерах
# GitHub, поддерживает кириллицу). Чтобы карточки выглядели как у Whitewill,
# положите в assets/fonts/ свободный шрифт с кириллицей, например
# Montserrat ExtraBold / Inter Bold / Manrope ExtraBold (лицензия OFL, скачать с
# fonts.google.com) и укажите путь. Для editorial-стиля — сериф (Playfair
# Display, Cormorant).
fonts:
  bold: ""         # например "assets/fonts/Montserrat-ExtraBold.ttf"
  regular: ""      # например "assets/fonts/Montserrat-Medium.ttf"
  serif: ""        # например "assets/fonts/PlayfairDisplay-Regular.ttf"

# ---------- Теги рубрик (правая пилюля) ----------
# Ключ — идентификатор рубрики из pipeline/config.py. Без решётки не надо,
# она часть текста. Пусто — пилюля не рисуется.
tags:
  market_pulse:   "#НОВОСТЬДНЯ"
  new_launch:     "#ЛОТНЕДЕЛИ"
  investor_math:  "#СЧИТАЕМ"
  rules_and_laws: "#ПРАВИЛА"
  area_guide:     "#РАЙОН"
  dubai_life:     "#ЖИЗНЬВДУБАЕ"
  events_afisha:  "#СОБЫТИЯ"
  faq_answer:     "#ЛАЙФХАК"
  case_story:     "#ИСТОРИЯ"
  personal:       "#ЛИЧНОЕ"
  from_owner:     "#ОТПЕРВОГОЛИЦА"
tag_default: "#НОВОСТЬДНЯ"
# Как тот же тег подписывается в editorial-стиле (пилюля-обводка по центру, как «НОВОСТЬ ДНЯ» у Ruble).
tag_labels:
  "#НОВОСТЬДНЯ": "НОВОСТЬ ДНЯ"
  "#ЛОТНЕДЕЛИ": "ЛОТ НЕДЕЛИ"
  "#СОБЫТИЯ": "АФИША"
  "#ЖИЗНЬВДУБАЕ": "ЖИЗНЬ В ДУБАЕ"
  "#ОТПЕРВОГОЛИЦА": "ОТ ПЕРВОГО ЛИЦА"

# ---------- Место (левая пилюля) ----------
# Ищем ключевые слова в заголовке и тексте поста; первое совпадение
# сверху вниз. Если ничего не нашли — place_default.
places:
  "АБУ-ДАБИ": ["абу-даби", "abu dhabi", "саадият", "яс", "yas island"]
  "ШАРДЖА": ["шардж", "sharjah"]
  "РАС-ЭЛЬ-ХАЙМА": ["рас-эль-хайм", "ras al khaimah", "rak "]
  "АДЖМАН": ["аджман", "ajman"]
  "ОАЭ": ["по всей стране", "все эмираты", "всех эмиратах"]
place_default: "ДУБАЙ"

# ---------- ИИ-генерация фона (OpenAI gpt-image-1) ----------
# Работает, только если в секретах есть OPENAI_API_KEY. Каждая картинка
# стоит денег (см. docs/SETUP.md). Для рубрик из skip_rubrics генерация
# не используется (docs/LEGAL.md: ИИ-картинка не должна выдаваться за фото
# конкретного объекта) — там берём пресс-фото застройщика или сток.
ai_image:
  model: "gpt-image-1"
  quality: "medium"        # low / medium / high — цена растёт вместе с качеством
  skip_rubrics: [new_launch, case_story]
  style_suffix: "bright photorealistic Dubai, golden hour, clean composition, no text, no people close-up"
